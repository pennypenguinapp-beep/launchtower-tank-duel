<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tank Duel — Artillery Duel</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2d333b;
    --text:#e6edf3; --dim:#8b949e; --accent:#3fb950; --accent2:#58a6ff;
    --p1:#3fb950; --p2:#f85149; --warn:#d29922;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;letter-spacing:2px;font-weight:700}
  header h1 span{color:var(--accent)}
  #hud{display:flex;gap:14px;font-size:12px;color:var(--dim);align-items:center;flex-wrap:wrap}
  #hud b{color:var(--text)}
  .tag{padding:2px 8px;border-radius:4px;font-size:11px;border:1px solid var(--line)}
  .tag.p1{color:var(--p1);border-color:var(--p1)}
  .tag.p2{color:var(--p2);border-color:var(--p2)}
  #stage{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #banner{position:absolute;top:14%;left:0;right:0;text-align:center;pointer-events:none;
    font-size:22px;font-weight:700;letter-spacing:3px;text-shadow:0 2px 12px #000;
    opacity:0;transition:opacity .3s}
  #banner.show{opacity:1}
  #controls{border-top:1px solid var(--line);background:var(--panel);
    padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row label{font-size:11px;color:var(--dim);min-width:52px}
  .val{font-size:12px;min-width:44px;text-align:right}
  input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);height:26px}
  .btn{background:#21262d;border:1px solid var(--line);color:var(--text);
    padding:8px 16px;border-radius:6px;font-family:inherit;font-size:13px;
    cursor:pointer;letter-spacing:1px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.fire{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:700}
  .btn.fire:hover{filter:brightness(1.15);color:#0d1117}
  .btn:disabled{opacity:.4;cursor:default}
  #wind{display:flex;align-items:center;gap:6px;font-size:12px}
  #windArrow{font-size:16px}
  #msg{font-size:12px;color:var(--dim);min-height:16px}
  footer{padding:6px;text-align:center;font-size:11px;color:var(--dim);
    border-top:1px solid var(--line);background:var(--panel)}
  footer a{color:var(--accent2);text-decoration:none}
  footer a:hover{text-decoration:underline}
  @media (max-width:600px){
    header h1{font-size:13px}
    #hud{gap:8px;font-size:11px}
    .btn{padding:8px 12px;font-size:12px}
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>TANK <span>DUEL</span></h1>
    <div id="hud">
      <span class="tag p1" id="hudP1">P1 ● 3</span>
      <span class="tag p2" id="hudP2">P2 ● 3</span>
      <span id="hudTurn">Turn: <b id="turnName">P1</b></span>
      <span id="hudScore">0 — 0</span>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
  </div>
  <div id="controls">
    <div class="row">
      <label>ANGLE</label>
      <input type="range" id="angle" min="5" max="85" value="45" step="1">
      <span class="val" id="angleVal">45°</span>
      <label>POWER</label>
      <input type="range" id="power" min="10" max="100" value="60" step="1">
      <span class="val" id="powerVal">60</span>
    </div>
    <div class="row">
      <div id="wind">
        <span>WIND</span>
        <span id="windArrow">→</span>
        <span id="windVal">0.0</span>
      </div>
      <span id="msg"></span>
      <span style="flex:1"></span>
      <button class="btn" id="btnNew">NEW GAME</button>
      <button class="btn fire" id="btnFire">FIRE</button>
    </div>
  </div>
  <footer>
    LaunchTower — free tools &amp; games for pixel artists and game devs ·
    <a href="https://pennypenguinapp-beep.github.io/" target="_blank" rel="noopener">more tools →</a>
  </footer>
</div>
<script>
(function(){
"use strict";
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const W0=960,H0=540;
let W=960,H=540,dpr=1;

// ---------- state ----------
const S={
  mode:'ai',            // 'ai' | '2p'
  turn:0,               // 0 = P1, 1 = P2
  phase:'aim',          // 'aim' | 'flying' | 'over'
  wind:0,
  scores:[0,0],
  shotsLeft:[3,3],
  tanks:[null,null],
  particles:[],
  smoke:[],
  shell:null,
  aiTimer:0,
  msg:'',
  banner:'',
  bannerT:0,
  time:0
};
const GRAV=0.16, WIND_K=0.0009, MAX_STEPS=900;

// ---------- terrain ----------
let ground=[]; // ground[y] = x where surface is (per row)
let groundX=[]; // groundX[x] = y of surface (per column)

function genTerrain(){
  const n=W;
  // base height via layered sines + smoothed random
  const a1=Math.random()*6.28,a2=Math.random()*6.28,a3=Math.random()*6.28;
  const f1=0.004+Math.random()*0.004, f2=0.011+Math.random()*0.006, f3=0.028;
  const amp1=H*0.16, amp2=H*0.07, amp3=H*0.03;
  const base=H*0.62;
  const h=new Array(n);
  for(let x=0;x<n;x++){
    h[x]=base
      +amp1*Math.sin(x*f1+a1)
      +amp2*Math.sin(x*f2+a2)
      +amp3*Math.sin(x*f3+a3);
  }
  // smooth
  for(let i=0;i<2;i++){
    for(let x=1;x<n-1;x++) h[x]=(h[x-1]+h[x]*2+h[x+1])/4;
  }
  // clamp
  const lo=H*0.38, hi=H*0.85;
  for(let x=0;x<n;x++) h[x]=Math.max(lo,Math.min(hi,h[x]));
  groundX=h;
  ground=new Array(H).fill(0);
  for(let x=0;x<n;x++){
    const y=Math.round(h[x]);
    for(let yy=y;yy<H;yy++) ground[yy]=x;
  }
}
function surfaceY(x){
  x=Math.max(0,Math.min(W-1,Math.round(x)));
  return groundX[x];
}
function dig(cx,cy,r){
  const r2=r*r;
  for(let x=Math.max(0,Math.floor(cx-r));x<=Math.min(W-1,Math.ceil(cx+r));x++){
    for(let y=Math.max(0,Math.floor(cy-r));y<=Math.min(H-1,Math.ceil(cy+r));y++){
      const dx=x-cx,dy=y-cy;
      if(dx*dx+dy*dy<=r2){
        // mark as dug by raising surface: find new surface for column x
        let ny=H;
        for(let yy=y;yy<H;yy++){
          if(ground[yy]!==undefined){}
        }
        // simpler: recompute column from ground map
      }
    }
  }
  // recompute columns affected
  const x0=Math.max(0,Math.floor(cx-r)), x1=Math.min(W-1,Math.ceil(cx+r));
  for(let x=x0;x<=x1;x++){
    // find first y where column is solid: we store per-row x; instead recompute via scan
    let ny=H;
    for(let y=0;y<H;y++){
      if(ground[y]===undefined) continue;
      // column x is solid at y if x >= ground[y] (ground[y] is leftmost solid x at row y)
      if(x>=ground[y]){ ny=y; break; }
    }
    groundX[x]=ny;
  }
}
function solidAt(x,y){
  x=Math.round(x);y=Math.round(y);
  if(x<0||x>=W||y<0) return false;
  if(y>=H) return true;
  return x>=ground[y];
}

// ---------- tanks ----------
function placeTanks(){
  // pick two spots on opposite sides with decent separation
  let tries=0;
  while(tries<200){
    tries++;
    const x1=40+Math.random()*(W*0.28);
    const x2=W*0.72+Math.random()*(W*0.28);
    const y1=surfaceY(x1), y2=surfaceY(x2);
    if(Math.abs(y1-y2)<H*0.35) continue;
    S.tanks=[
      {x:x1,y:y1,alive:true,color:'#3fb950',barrel:45,side:1},
      {x:x2,y:y2,alive:true,color:'#f85149',barrel:135,side:-1}
    ];
    return;
  }
  S.tanks=[
    {x:W*0.2,y:surfaceY(W*0.2),alive:true,color:'#3fb950',barrel:45,side:1},
    {x:W*0.8,y:surfaceY(W*0.8),alive:true,color:'#f85149',barrel:135,side:-1}
  ];
}

// ---------- particles ----------
function boom(x,y,color,n){
  for(let i=0;i<(n||26);i++){
    const a=Math.random()*6.28, sp=1+Math.random()*4;
    S.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,
      life:20+Math.random()*20,color:color||'#f0883e',size:1.5+Math.random()*2.5});
  }
  S.smoke.push({x,y,r:4,life:40,max:40});
}
function stepParticles(){
  for(let i=S.particles.length-1;i>=0;i--){
    const p=S.particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
    if(p.life<=0) S.particles.splice(i,1);
  }
  for(let i=S.smoke.length-1;i>=0;i--){
    const s=S.smoke[i];
    s.r+=0.5;s.life--;
    if(s.life<=0) S.smoke.splice(i,1);
  }
}

// ---------- shell ----------
function fireShell(){
  const t=S.tanks[S.turn];
  const ang=+$('angle').value*Math.PI/180;
  const pw=+$('power').value;
  const dir=(S.turn===0)?1:-1;
  const vx=Math.cos(ang)*pw*0.16*dir;
  const vy=-Math.sin(ang)*pw*0.16;
  S.shell={x:t.x,y:t.y-14,vx,vy,trail:[]};
  S.phase='flying';
  $('btnFire').disabled=true;
  $('angle').disabled=true;
  $('power').disabled=true;
  setMsg('');
}
function stepShell(){
  const s=S.shell;
  if(!s) return;
  s.trail.push({x:s.x,y:s.y});
  if(s.trail.length>14) s.trail.shift();
  s.vx+=S.wind*WIND_K;
  s.vy+=GRAV;
  s.x+=s.vx; s.y+=s.vy;
  // hit ground
  if(solidAt(s.x,s.y)){
    explode(s.x,s.y);
    return;
  }
  // hit tank
  for(let i=0;i<2;i++){
    const t=S.tanks[i];
    if(!t.alive) continue;
    const dx=s.x-t.x, dy=s.y-(t.y-10);
    if(dx*dx+dy*dy<18*18){
      explode(s.x,s.y);
      return;
    }
  }
  // off screen
  if(s.x<-40||s.x>W+40||s.y>H+40){
    S.shell=null;
    endShot(false);
  }
}
function explode(x,y){
  boom(x,y,'#f0883e',30);
  dig(x,y,22);
  S.shell=null;
  // damage tanks
  let hit=-1;
  for(let i=0;i<2;i++){
    const t=S.tanks[i];
    if(!t.alive) continue;
    const dx=x-t.x, dy=y-(t.y-10);
    if(dx*dx+dy*dy<26*26){
      t.alive=false;
      hit=i;
      boom(t.x,t.y-10,t.color,40);
    }
  }
  endShot(hit);
}
function endShot(hit){
  S.phase='aim';
  $('btnFire').disabled=false;
  $('angle').disabled=false;
  $('power').disabled=false;
  S.shotsLeft[S.turn]--;
  if(hit>=0){
    S.scores[S.turn]++;
    banner((S.turn===0?'P1':'P2')+' SCORES!');
  } else {
    banner('MISS');
  }
  updateHUD();
  // check round end
  if(S.shotsLeft[S.turn]<=0 && S.shotsLeft[1-S.turn]<=0){
    roundOver();
    return;
  }
  // if current player out of shots, pass turn (skip)
  if(S.shotsLeft[S.turn]<=0){
    S.turn=1-S.turn;
    setMsg((S.turn===0?'P1':'P2')+' is out of shells — turn skipped');
  }
  newWind();
  updateHUD();
  if(S.mode==='ai' && S.turn===1 && S.phase==='aim'){
    aiPlan();
  }
}
function roundOver(){
  S.phase='over';
  const a=S.scores[0],b=S.scores[1];
  let msg;
  if(a>b) msg='P1 WINS THE ROUND';
  else if(b>a) msg='P2 WINS THE ROUND';
  else msg='DRAW';
  banner(msg);
  setMsg('Press NEW GAME for another round');
}

// ---------- AI ----------
function aiPlan(){
  S.aiTimer=setTimeout(aiFire, 900+Math.random()*700);
}
function aiFire(){
  if(S.phase!=='aim'||S.turn!==1) return;
  const me=S.tanks[1], foe=S.tanks[0];
  const dx=foe.x-me.x, dy=foe.y-14-(me.y-14);
  const dist=Math.abs(dx);
  // rough ballistic solve, 3 trials with noise
  let best=null;
  for(let trial=0;trial<3;trial++){
    const pw=40+Math.random()*55;
    // solve angle for given power (no wind)
    const v=pw*0.16;
    const v2=v*v;
    const g=GRAV;
    const d=dx;
    const disc=v2*v2 - g*(g*d*d + 2*dy*v2);
    if(disc<0) continue;
    const sq=Math.sqrt(disc);
    const num=v2+sq;
    if(num<=0) continue;
    let ang=Math.atan2(num, d);
    if(ang<0.08) ang=0.08;
    if(ang>1.45) ang=1.45;
    // simulate with wind to score
    let x=me.x,y=me.y-14,vx=Math.cos(ang)*v,vy=-Math.sin(ang)*v;
    let hitFoe=false,steps=0;
    while(steps++<MAX_STEPS){
      vx+=S.wind*WIND_K; vy+=GRAV; x+=vx; y+=vy;
      if(solidAt(x,y)) break;
      const ddx=x-foe.x, ddy=y-(foe.y-10);
      if(ddx*ddx+ddy*ddy<18*18){ hitFoe=true; break; }
      if(x<-40||x>W+40||y>H+40) break;
    }
    if(hitFoe){ best={pw,angDeg:ang*180/Math.PI}; break; }
  }
  if(!best){
    best={pw:55+Math.random()*30, angDeg:45+Math.random()*20-10};
  }
  // add human-like error
  best.pw=Math.max(10,Math.min(100,best.pw+(Math.random()-0.5)*14));
  best.angDeg=Math.max(5,Math.min(85,best.angDeg+(Math.random()-0.5)*8));
  $('power').value=Math.round(best.pw);
  $('angle').value=Math.round(best.angDeg);
  syncSliders();
  setTimeout(()=>{ if(S.phase==='aim'&&S.turn===1) fireShell(); }, 500);
}

// ---------- wind ----------
function newWind(){
  S.wind=(Math.random()-0.5)*2*12; // -12..12
  const w=Math.abs(S.wind).toFixed(1);
  $('windVal').textContent=w;
  $('windArrow').textContent = S.wind>0.3?'→':(S.wind<-0.3?'←':'·');
  $('windArrow').style.color = Math.abs(S.wind)>6?'var(--warn)':'var(--dim)';
}

// ---------- HUD ----------
function updateHUD(){
  $('hudP1').textContent='P1 ● '+S.shotsLeft[0];
  $('hudP2').textContent='P2 ● '+S.shotsLeft[1];
  $('turnName').textContent=(S.turn===0?'P1':'P2');
  $('hudScore').textContent=S.scores[0]+' — '+S.scores[1];
}
function setMsg(m){ S.msg=m; $('msg').textContent=m; }
function banner(t){
  S.banner=t; S.bannerT=110;
  const b=$('banner');
  b.textContent=t;
  b.classList.add('show');
}

// ---------- new game ----------
function newGame(){
  clearTimeout(S.aiTimer);
  S.scores=[0,0];
  S.shotsLeft=[3,3];
  S.turn=0;
  S.phase='aim';
  S.particles=[];
  S.smoke=[];
  S.shell=null;
  genTerrain();
  placeTanks();
  newWind();
  $('angle').value=45;
  $('power').value=60;
  syncSliders();
  $('btnFire').disabled=false;
  $('angle').disabled=false;
  $('power').disabled=false;
  setMsg('');
  updateHUD();
  banner('ROUND START — P1');
}

// ---------- input ----------
function syncSliders(){
  $('angleVal').textContent=$('angle').value+'°';
  $('powerVal').textContent=$('power').value;
}
$('angle').addEventListener('input',syncSliders);
$('power').addEventListener('input',syncSliders);
$('btnFire').addEventListener('click',()=>{
  if(S.phase!=='aim') return;
  if(S.mode==='ai'&&S.turn===1) return;
  fireShell();
});
$('btnNew').addEventListener('click',newGame);
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    if(S.phase==='aim' && !(S.mode==='ai'&&S.turn===1)) fireShell();
  }
  if(e.key==='ArrowUp'){ $('angle').value=Math.min(85,+$('angle').value+1); syncSliders(); }
  if(e.key==='ArrowDown'){ $('angle').value=Math.max(5,+$('angle').value-1); syncSliders(); }
  if(e.key==='ArrowRight'){ $('power').value=Math.min(100,+$('power').value+2); syncSliders(); }
  if(e.key==='ArrowLeft'){ $('power').value=Math.max(10,+$('power').value-2); syncSliders(); }
  if(e.key==='n'||e.key==='N') newGame();
});

// mode toggle: tap canvas twice quickly? Use a small button in HUD
function setMode(m){
  S.mode=m;
  newGame();
}
// add a mode button dynamically
const modeBtn=document.createElement('button');
modeBtn.className='btn';
modeBtn.id='btnMode';
modeBtn.textContent='MODE: VS AI';
modeBtn.addEventListener('click',()=>{
  if(S.mode==='ai'){ setMode('2p'); modeBtn.textContent='MODE: 2P'; }
  else { setMode('ai'); modeBtn.textContent='MODE: VS AI'; }
});
$('btnNew').parentNode.insertBefore(modeBtn,$('btnNew'));

// ---------- resize ----------
function resize(){
  const stage=document.getElementById('stage');
  const r=stage.getBoundingClientRect();
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(320,Math.floor(r.width));
  H=Math.max(240,Math.floor(r.height));
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // regenerate terrain for new width (keep tanks relative)
  genTerrain();
  if(S.tanks[0]){
    S.tanks[0].x=W*0.2; S.tanks[0].y=surfaceY(W*0.2);
    S.tanks[1].x=W*0.8; S.tanks[1].y=surfaceY(W*0.8);
  }
}
window.addEventListener('resize',resize);

// ---------- render ----------
function drawTerrain(){
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d1117');
  g.addColorStop(0.6,'#161b22');
  g.addColorStop(1,'#1c2128');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='rgba(255,255,255,0.25)';
  for(let i=0;i<40;i++){
    const sx=(i*137.5)%W, sy=(i*89.3)%(H*0.5);
    ctx.fillRect(sx,sy,1,1);
  }
  // ground
  ctx.fillStyle='#2d333b';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let x=0;x<W;x+=2) ctx.lineTo(x,groundX[x]);
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();
  // ground top line
  ctx.strokeStyle='#444c56';
  ctx.lineWidth=2;
  ctx.beginPath();
  for(let x=0;x<W;x+=2){
    if(x===0) ctx.moveTo(x,groundX[x]);
    else ctx.lineTo(x,groundX[x]);
  }
  ctx.stroke();
  // grass tufts
  ctx.strokeStyle='#3fb950';
  ctx.lineWidth=1;
  for(let x=4;x<W;x+=14){
    const y=groundX[x];
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x-2,y-4);
    ctx.moveTo(x,y);
    ctx.lineTo(x+2,y-5);
    ctx.stroke();
  }
}
function drawTank(t){
  if(!t.alive) return;
  const x=t.x, y=t.y;
  // body
  ctx.fillStyle=t.color;
  ctx.beginPath();
  ctx.roundRect(x-14,y-10,28,10,3);
  ctx.fill();
  // turret
  ctx.fillStyle='#21262d';
  ctx.beginPath();
  ctx.arc(x,y-12,7,0,6.28);
  ctx.fill();
  // barrel
  const ang=(S.turn===0)?+$('angle').value:180-+$('angle').value;
  const rad=ang*Math.PI/180;
  const bx=x+Math.cos(rad)*16, by=y-12-Math.sin(rad)*16;
  ctx.strokeStyle=t.color;
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x,y-12);
  ctx.lineTo(bx,by);
  ctx.stroke();
  // wheels
  ctx.fillStyle='#161b22';
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.arc(x+i*8,y+2,3,0,6.28);
    ctx.fill();
  }
  // label
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.font='9px monospace';
  ctx.textAlign='center';
  ctx.fillText(S.tanks.indexOf(t)===0?'P1':'P2', x, y+14);
}
function drawShell(){
  const s=S.shell;
  if(!s) return;
  // trail
  for(let i=0;i<s.trail.length;i++){
    const p=s.trail[i];
    const a=i/s.trail.length*0.5;
    ctx.fillStyle='rgba(240,136,62,'+a+')';
    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,6.28);
    ctx.fill();
  }
  ctx.fillStyle='#f0883e';
  ctx.beginPath();
  ctx.arc(s.x,s.y,3,0,6.28);
  ctx.fill();
}
function drawParticles(){
  for(const p of S.particles){
    ctx.globalAlpha=Math.max(0,p.life/40);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  for(const s of S.smoke){
    ctx.globalAlpha=Math.max(0,s.life/s.max)*0.3;
    ctx.fillStyle='#8b949e';
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,6.28);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawAimGuide(){
  if(S.phase!=='aim') return;
  const t=S.tanks[S.turn];
  if(!t.alive) return;
  const ang=+$('angle').value*Math.PI/180;
  const pw=+$('power').value;
  const dir=(S.turn===0)?1:-1;
  // dotted preview (no wind, short)
  let x=t.x,y=t.y-14;
  let vx=Math.cos(ang)*pw*0.16*dir, vy=-Math.sin(ang)*pw*0.16;
  ctx.fillStyle='rgba(255,255,255,0.3)';
  for(let i=0;i<10;i++){
    vy+=GRAV; x+=vx; y+=vy;
    if(solidAt(x,y)) break;
    ctx.beginPath();
    ctx.arc(x,y,1.5,0,6.28);
    ctx.fill();
  }
}
function render(){
  ctx.clearRect(0,0,W,H);
  drawTerrain();
  drawAimGuide();
  for(const t of S.tanks) drawTank(t);
  drawShell();
  drawParticles();
  // banner fade
  if(S.bannerT>0){
    S.bannerT--;
    if(S.bannerT===0) $('banner').classList.remove('show');
  }
}

// ---------- loop ----------
function loop(){
  S.time++;
  if(S.phase==='flying') stepShell();
  stepParticles();
  render();
  requestAnimationFrame(loop);
}

// ---------- init ----------
resize();
newGame();
loop();
})();
</script>
</body>
